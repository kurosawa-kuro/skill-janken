<style>
  :root {
    color-scheme: light;
    font-family: system-ui, "Yu Gothic", sans-serif;
    color: #243b40;
    background: #f6f3e9;
    --ink: #243b40;
    --muted: #52656a;
    --line: #cbd4ce;
    --green: #215c49;
    --paper: #fffef9;
    --orange: #ae4c26;
  }
  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  body {
    margin: 0;
    font-size: 16px;
    line-height: 1.65;
    background-image: radial-gradient(#243b4012 1px, transparent 1px);
    background-size: 22px 22px;
  }
  main {
    width: min(1120px, 100%);
    margin: auto;
    padding: 28px 28px 60px;
  }
  .game main {
    padding-bottom: calc(112px + env(safe-area-inset-bottom));
  }
  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }
  h1 {
    font-size: clamp(1.15rem, 2.8vw, 1.6rem);
    line-height: 1.35;
    margin-bottom: 0;
    letter-spacing: 0.02em;
  }
  h2 {
    font-size: clamp(1.55rem, 4vw, 2.15rem);
    line-height: 1.4;
    margin-bottom: 12px;
  }
  h3 {
    font-size: 1.15rem;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  p {
    margin-bottom: 12px;
  }
  button,
  input,
  select {
    font: inherit;
  }
  button {
    min-height: 48px;
    min-width: 44px;
    padding: 12px 20px;
    border: 2px solid transparent;
    border-radius: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    cursor: pointer;
    line-height: 1.4;
    transition:
      background 0.15s,
      transform 0.15s;
  }
  button:hover:not(:disabled) {
    filter: brightness(0.94);
  }
  button:active:not(:disabled) {
    transform: translateY(1px);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  :where(button, input, select, summary, a):focus-visible {
    outline: 3px solid #9c411c;
    outline-offset: 4px;
  }
  h2:focus,
  #view:focus {
    outline: none;
  }
  input[type="radio"],
  input[type="checkbox"] {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: var(--green);
  }
  select {
    min-height: 48px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    max-width: 100%;
    color: var(--ink);
  }
  .secondary {
    background: #e8ede4;
    color: var(--ink);
  }
  .text-button {
    background: transparent;
    color: var(--green);
    padding: 8px 12px;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .eyebrow {
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .hint {
    display: block;
    color: var(--muted);
    font-size: 1rem;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 8px;
    background: #eaf0e6;
    color: #315340;
    font-size: 0.875rem;
    font-weight: 700;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border: 2px solid var(--ink);
    border-radius: 14px;
    background: #f6c96a;
    font-size: 32px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .summary {
    display: flex;
    flex-wrap: wrap;
    min-width: 0;
    align-items: center;
    gap: 16px;
    text-align: right;
  }
  .summary .record {
    overflow-wrap: anywhere;
    font-size: 0.875rem;
    margin: 0;
    color: var(--muted);
  }
  .summary .score {
    margin: 0;
    font-weight: 800;
    white-space: nowrap;
  }
  .summary .score strong {
    font-size: 1.8rem;
    padding-left: 6px;
  }
  .connection-panel {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #ffffffc9;
    padding: 4px 14px;
    margin-bottom: 26px;
  }
  .status-line {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #status {
    flex: 1;
    margin: 0;
    font-size: 0.875rem;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  [data-state="busy"] .status-dot {
    animation: pulse 1s ease-in-out infinite;
  }
  [data-state="attention"] {
    border-color: #b46a33;
    background: #fff4df;
  }
  [data-state="attention"] .status-dot {
    background: #a04a1e;
  }
  #recovery-hint {
    margin: 8px 0;
  }
  .recovery-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .recovery-actions:has(button:not([hidden])) {
    padding: 8px 0;
  }
  #refresh-state {
    font-size: 0.875rem;
  }
  .view-heading {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .view-heading h2 {
    margin: 0;
  }
  .panel,
  .card,
  .step-panel {
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--paper);
    padding: 24px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.65fr 1fr;
    gap: 20px;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    background: #e8efdf;
    position: relative;
    overflow: hidden;
    padding: 32px;
  }
  .hero h3 {
    font-size: clamp(1.7rem, 4vw, 2.65rem);
    max-width: 15em;
    letter-spacing: 0.02em;
  }
  .hero .primary {
    width: 100%;
    font-size: 1.1rem;
  }
  .hero-stage {
    width: 100%;
    min-height: 196px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-bottom: 20px;
    background: radial-gradient(ellipse at center, #fefcf2 0%, #fefcf200 70%);
  }
  .hero-stage .stage-caption {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 1.15rem;
  }
  .hero-stage .mascot {
    --size: 114px;
  }
  .side-stack {
    display: grid;
    gap: 20px;
  }
  .collection-progress {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 16px 0;
  }
  .collection-progress span {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px dashed #7c8c84;
    color: var(--muted);
  }
  .collection-progress .filled {
    background: #dce7ca;
    color: #234930;
    border: 1px solid #839d68;
  }
  .collection-panel button {
    width: 100%;
  }
  .collection-panel .hint {
    margin-top: 12px;
  }
  .section-link {
    text-align: left;
    display: block;
    width: 100%;
    background: transparent;
    color: var(--ink);
    padding: 0;
    border: 0;
  }
  .section-link strong {
    display: block;
    font-size: 1.2rem;
    margin-bottom: 8px;
  }
  .mascot {
    --size: 76px;
    position: relative;
    display: inline-grid;
    place-items: center;
    width: var(--size);
    height: var(--size);
    flex-shrink: 0;
    isolation: isolate;
  }
  .mascot::before {
    content: "";
    position: absolute;
    inset: 6%;
    border: 2px solid var(--ink);
    box-shadow: inset -6px -8px 0 #0000000b;
    z-index: -1;
  }
  .mascot.C01::before {
    background: #efad79;
    border-radius: 65% 30% 45% 45%;
    transform: rotate(-12deg);
  }
  .mascot.C02::before {
    background: #99ced4;
    border-radius: 12% 65% 50% 65%;
    transform: rotate(45deg);
  }
  .mascot.C03::before {
    background: #b5cb80;
    border-radius: 10% 65% 12% 65%;
    transform: rotate(-18deg);
  }
  .mascot-face {
    font-size: calc(var(--size) * 0.23);
    letter-spacing: 0.12em;
    transform: translateY(6px);
    color: #243b40;
    font-weight: 900;
  }
  .mascot.small {
    --size: 44px;
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .card .portrait {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 24px 0;
    border-radius: 18px;
    background: #f2f1e5;
  }
  .card .portrait .mascot {
    --size: 100px;
  }
  .card h3,
  .card p {
    margin: 0;
  }
  .card button {
    width: 100%;
    margin-top: auto;
  }
  .card.locked .portrait {
    background: #eeefea;
  }
  .card.locked .mascot {
    opacity: 0.5;
    filter: grayscale(1);
  }
  .skill-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .skill-tags .tag {
    font-size: 0.875rem;
  }
  .friends-layout > .collection-panel {
    margin-bottom: 20px;
  }
  .step-panel {
    margin: 0;
    border: 1px solid var(--line);
    min-width: 0;
  }
  fieldset.step-panel legend {
    padding: 0 8px;
    font-weight: 800;
  }
  .step-number {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e1e9d9;
    color: var(--green);
    margin-right: 8px;
    font-size: 0.875rem;
  }
  .battle-layout {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 20px;
    align-items: start;
  }
  .battle-setup {
    display: grid;
    gap: 20px;
  }
  .character-options {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .character-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    padding: 10px 4px;
    gap: 6px;
    border: 2px solid var(--line);
    border-radius: 16px;
    background: white;
    min-width: 0;
  }
  .character-option:has(input:checked) {
    border-color: var(--green);
    background: #edf3e4;
  }
  .character-option:has(input:disabled) {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .character-option strong {
    font-size: 1rem;
    overflow-wrap: anywhere;
  }
  .character-option .mascot {
    --size: 48px;
  }
  .character-option input {
    margin: 0;
  }
  .character-option .hint {
    font-size: 0.8rem;
  }
  .skill-options {
    display: grid;
    gap: 10px;
  }
  .skill {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    cursor: pointer;
    background: white;
  }
  .skill:has(input:checked) {
    background: #edf3e4;
    border-color: var(--green);
  }
  .skill strong,
  .skill .hint {
    display: block;
  }
  .skill:has(input:disabled) {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .skill-mark {
    display: inline-grid;
    place-items: center;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border: 2px solid currentColor;
    font-weight: 800;
    color: var(--ink);
    background: #f5cf70;
  }
  .skill-mark.S01 {
    border-radius: 50%;
  }
  .skill-mark.S02 {
    border-radius: 8px;
    background: #b2d7dc;
  }
  .skill-mark.S03 {
    border-radius: 50% 8px;
    background: #c2d89e;
  }
  .arena {
    border: 2px solid #a8b89a;
    background: #f9faef;
  }
  .battle-pair {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .battle-pair .versus {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 0.1em;
  }
  .cpu-mark {
    width: 60px;
    height: 60px;
    display: grid;
    place-items: center;
    background: #ece8dc;
    border: 2px dashed #73807a;
    border-radius: 18px;
    font-size: 1.6rem;
    font-weight: 800;
  }
  .hands {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin: 16px 0;
  }
  .hands button {
    background: #fffef9;
    border: 2px solid var(--line);
    color: var(--ink);
    padding: 14px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .hands button[aria-pressed="true"] {
    background: #fce8b6;
    border-color: #8d551b;
    box-shadow: 0 3px 0 #8d551b;
  }
  .hand-symbol {
    font-size: 2.4rem;
    line-height: 1.2;
  }
  .battle-submit {
    width: 100%;
    font-size: 1.1rem;
  }
  #hand-preview {
    min-height: 1.65em;
    text-align: center;
  }
  .rule-summary {
    margin-top: 20px;
  }
  details {
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 18px;
  }
  summary {
    cursor: pointer;
    min-height: 44px;
    padding: 6px 0;
    font-weight: 700;
  }
  .rule-points {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .rule-points span {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  #navigation {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: min(620px, calc(100% - 32px));
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    background: var(--paper);
    border: 1px solid #aebcb0;
    border-radius: 22px;
    box-shadow: 0 8px 28px #243b4020;
    z-index: 3;
    margin-bottom: env(safe-area-inset-bottom);
  }
  #navigation button {
    border: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 1rem;
    padding: 6px 2px;
    background: transparent;
    color: var(--muted);
    min-width: 0;
    border-radius: 16px;
  }
  #navigation button span {
    font-size: 1.25rem;
    line-height: 1.3;
  }
  #navigation button[aria-current="page"] {
    color: var(--green);
    background: #e5eddc;
    box-shadow: inset 0 -3px var(--green);
  }
  dialog {
    width: min(520px, calc(100% - 24px));
    max-height: calc(100dvh - 32px);
    overflow: auto;
    border: 2px solid var(--ink);
    border-radius: 26px;
    padding: 28px;
    color: var(--ink);
    background: var(--paper);
    box-shadow: 7px 7px 0 #00000025;
  }
  dialog::backdrop {
    background: #192e35ab;
  }
  dialog h2 {
    font-size: 2rem;
  }
  .result-actions {
    display: grid;
    gap: 10px;
    margin-top: 24px;
  }
  .result-hands {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
  }
  .result-hand {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-radius: 16px;
    background: #edf0e4;
    padding: 12px;
  }
  .earned {
    font-size: 2.6rem;
    font-weight: 900;
    line-height: 1.3;
    margin: 12px 0 4px;
  }
  .point-breakdown {
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #f4f3e8;
  }
  .point-breakdown p:last-child {
    margin: 0;
  }
  .result-dialogue {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 18px;
  }
  .bubble {
    margin: 0;
    padding: 16px;
    background: #e8efdf;
    border-radius: 18px 18px 18px 4px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .result-source {
    font-size: 0.875rem;
    color: var(--muted);
  }
  .result-portrait {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    background: #f5e5b8;
    border-radius: 18px;
  }
  .result-portrait .mascot {
    --size: 96px;
  }
  .relations-layout {
    display: grid;
    gap: 20px;
  }
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
  }
  caption {
    text-align: left;
    font-weight: 800;
    padding-bottom: 16px;
  }
  th,
  td {
    padding: 8px 4px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    overflow-wrap: anywhere;
  }
  th {
    font-size: 1rem;
  }
  th button {
    background: transparent;
    color: var(--ink);
    padding: 8px 2px;
    width: 100%;
    min-width: 0;
  }
  th button[aria-pressed="true"] {
    background: #e4edd8;
    box-shadow: inset 0 -3px var(--green);
  }
  th .hint {
    font-size: 0.8rem;
  }
  td {
    font-size: 1.3rem;
  }
  td.highlight {
    background: #f9e7b5;
    font-weight: 800;
  }
  .discovery {
    background: #edf2e4;
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .history-list {
    list-style: none;
    padding: 0;
    margin-bottom: 0;
  }
  .history-list li {
    border-top: 1px solid var(--line);
    padding: 14px 0;
  }
  .empty-state {
    text-align: center;
    padding: 28px 12px;
    background: #f3f3e8;
    border-radius: 16px;
  }
  .notice {
    border: 1px solid #be895a;
    background: #fff1db;
    border-radius: 14px;
    padding: 16px;
    margin: 20px 0;
  }
  .skip-link {
    position: fixed;
    top: -100px;
    left: 16px;
    background: white;
    color: var(--ink);
    z-index: 10;
    padding: 12px;
  }
  .skip-link:focus {
    top: 12px;
  }
  .admin-header {
    margin-bottom: 24px;
  }
  .admin-header h1 {
    font-size: 2rem;
    margin-bottom: 12px;
  }
  .admin-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .admin-overview {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .admin-stat {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .admin-stat strong {
    display: block;
    font-size: 1.65rem;
  }
  .admin-stat span {
    color: var(--muted);
    font-size: 0.875rem;
  }
  .admin-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 24px 0 16px;
  }
  .admin-filters button {
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .admin-filters button[aria-pressed="true"] {
    background: var(--green);
    color: white;
  }
  #admin-slots {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  #admin-slots .card {
    gap: 16px;
    padding: 20px;
  }
  #admin-slots h2 {
    font-size: 1.2rem;
    margin: 0;
  }
  #admin-slots h3 {
    font-size: 1rem;
    margin: 0;
  }
  #admin-slots label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    width: 100%;
    cursor: pointer;
  }
  #admin-slots label:has(input:checked) {
    background: #eaf1e1;
    border-color: var(--green);
  }
  #admin-slots .slot-section {
    display: grid;
    gap: 12px;

<!doctype html>
<html lang="ja">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <?!= include_("client/styles") ?>
  </head>
  <body class="game">
    <a class="skip-link" href="#view" target="_self">あそぶところへ</a>
    <main aria-labelledby="title">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <div>
            <p class="eyebrow">あつめる・ためす・つながる</p>
            <h1 id="title">スキルじゃんけんラボ</h1>
          </div>
        </div>
        <div id="summary" class="summary" hidden></div>
      </header>
      <section
        id="panel"
        class="connection-panel"
        aria-label="きろくの状態"
        aria-busy="true"
        data-state="busy"
      >
        <div class="status-line">
          <span class="status-dot" aria-hidden="true"></span>
          <p id="status" role="status" aria-live="polite">
            きろくをよんでいるよ…
          </p>
          <button id="refresh-state" class="text-button" disabled>
            きろくをよみなおす
          </button>
        </div>
        <p id="recovery-hint" class="hint" hidden></p>
        <div class="recovery-actions">
          <button id="retry" hidden>もういちどよむ</button
          ><button id="resend" hidden>つづきのきろくをかくにん</button>
        </div>
      </section>
      <section
        id="view"
        hidden
        tabindex="-1"
        aria-labelledby="view-title"
      ></section>
      <nav id="navigation" aria-label="あそぶばしょ" hidden>
        <button data-view="home">
          <span aria-hidden="true">⌂</span>ホーム
        </button>
        <button data-view="friends">
          <span aria-hidden="true">♧</span>なかま
        </button>
        <button data-view="battle">
          <span aria-hidden="true">✌</span>じゃんけん
        </button>
        <button data-view="relations">
          <span aria-hidden="true">✳</span>つながり
        </button>
      </nav>
      <dialog id="result" aria-labelledby="result-title">
        <p id="result-kicker" class="eyebrow">たんけんのきろく</p>
        <h2 id="result-title" tabindex="-1">けっか</h2>
        <div id="result-body"></div>
        <div class="result-actions">
          <button id="result-next">もういちど</button
          ><button id="result-close" class="secondary">とじる</button>
        </div>
      </dialog>
    </main>
    <script>
      window.CONFIG = <?!= serializeForScript_(config) ?>;
    </script>
    <?!= include_("client/core/dom") ?><?!= include_("client/core/api") ?><?!=
    include_("client/core/pending") ?><?!= include_("client/core/dialogue")
    ?><?!= include_("client/app") ?>
  </body>
</html>

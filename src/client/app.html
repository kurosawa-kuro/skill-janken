<script>
  (() => {
    const { $, el } = App.dom;
    let busy = false;
    App.commands = App.pending.create({
      changed: (status) => {
        document.querySelectorAll("[data-mutation]").forEach((button) => {
          button.disabled =
            status.busy ||
            status.blocked ||
            !!status.pending ||
            status.needsSync;
        });
        $("resend").disabled = status.busy || status.blocked;
      },
    });
    async function showCompanion(character) {
      const container = $("companion");
      container.replaceChildren();
      container.hidden = !character;
      if (!character) return;
      const fallback = el("p", "record", character.name);
      container.append(fallback);
      try {
        const url = await App.assets.get(character.assetId);
        const img = document.createElement("img");
        img.alt = character.name;
        img.className = "companion-image";
        img.hidden = true;
        img.onload = () => {
          img.hidden = false;
          fallback.hidden = true;
        };
        img.onerror = () => {
          App.assets.invalidate(character.assetId);
          img.remove();
          fallback.hidden = false;
        };
        container.append(img);
        img.src = url;
      } catch (_) {
        // The name stays visible; image availability never hides the record.
      }
    }
    async function load(resume = false) {
      if (busy) return;
      const pending = App.commands.status();
      if (pending.blocked || (pending.pending && !resume)) {
        $("status").textContent = pending.blocked
          ? "きろくをかくにんしています。大人をよんでね"
          : "とどいたか、つづきのきろくをかくにんしよう";
        $("resend").hidden = pending.blocked;
        $("panel").setAttribute("aria-busy", "false");
        return;
      }
      busy = true;
      $("panel").setAttribute("aria-busy", "true");
      $("status").textContent = "きろくをよんでいるよ…";
      $("summary").hidden = true;
      $("summary").replaceChildren();
      $("companion").hidden = true;
      $("companion").replaceChildren();
      $("retry").hidden = true;
      $("resend").hidden = true;
      $("retry").disabled = true;
      try {
        const response = resume
          ? (await App.commands.retry()).latest
          : await App.commands.sync();
        const { player, state } = response.data;
        if (
          !player ||
          typeof player.displayName !== "string" ||
          !state ||
          !Number.isSafeInteger(state.points) ||
          state.points < 0 ||
          !Number.isSafeInteger(response.version) ||
          response.version !== state.version
        )
          throw new Error("Invalid state");
        $("status").textContent = "きろくをよめたよ";
        $("summary").append(
          el("p", "record", player.displayName),
          el("p", "record", `たんきゅうポイント ${state.points}`),
        );
        $("summary").hidden = false;
        const character = response.data.characters?.find((item) =>
          state.ownedCharacterIds?.includes(item.characterId),
        );
        void showCompanion(character);
      } catch (error) {
        $("status").textContent =
          error.kind === "business" && error.code === "DATA_INTEGRITY_ERROR"
            ? "きろくをかくにんしています。大人をよんでね"
            : "きろくをよめなかったよ。大人といっしょに、もういちどためしてね。";
        const pending = App.commands.status();
        $("resend").hidden = !pending.pending || pending.blocked;
        $("retry").hidden = !!pending.pending || pending.blocked;
      } finally {
        busy = false;
        $("retry").disabled = false;
        $("panel").setAttribute("aria-busy", "false");
      }
    }
    $("retry").addEventListener("click", () => load());
    $("resend").addEventListener("click", () => load(true));
    load();
  })();
</script>

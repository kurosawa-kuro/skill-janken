<script>
  App.assets = (() => {
    // No persistent cache. Revalidate each view's version before reusing bytes.
    const cache = new Map(),
      pending = new Map();
    async function get(assetId) {
      if (pending.has(assetId)) return pending.get(assetId);
      const work = (async () => {
        const { data } = await App.api.call({
          op: "getAsset",
          payload: { assetId },
        });
        if (
          data.assetId !== assetId ||
          data.mimeType !== "image/webp" ||
          !Number.isSafeInteger(data.version) ||
          data.version < 1 ||
          typeof data.base64 !== "string" ||
          data.base64.length > 136536 ||
          !/^[A-Za-z0-9+/]+={0,2}$/.test(data.base64)
        )
          throw Error("Asset unavailable");
        const key = assetId + ":" + data.version;
        const existing = cache.get(key);
        for (const item of cache.keys())
          if (item.startsWith(assetId + ":")) cache.delete(item);
        const url = existing || `data:image/webp;base64,${data.base64}`;
        cache.set(key, url);
        while (cache.size > 7) cache.delete(cache.keys().next().value);
        return url;
      })();
      pending.set(assetId, work);
      try {
        return await work;
      } catch (error) {
        for (const key of cache.keys())
          if (key.startsWith(assetId + ":")) cache.delete(key);
        throw error;
      } finally {
        pending.delete(assetId);
      }
    }
    function invalidate(assetId) {
      for (const key of cache.keys())
        if (key.startsWith(assetId + ":")) cache.delete(key);
    }
    return { get, invalidate };
  })();
</script>

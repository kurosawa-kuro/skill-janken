<script>
  // Adapted from ai-english-trainer/app.html: persist before sending.
  // Unlike the donor, storage failure blocks writes instead of being ignored.
  App.pending = (() => {
    const KEY = "skill-janken-pending-v1";
    function create({
      rpc = (request) => App.api.call(request),
      storage,
      initial,
      uuid = () => crypto.randomUUID(),
      changed = () => {},
    } = {}) {
      const datasetId = initial?.data?.datasetId;
      const storageKey = KEY + "-2-" + datasetId;
      let latest = initial;
      let pending = null,
        busy = false,
        blocked = false,
        needsSync = true;
      const status = () => ({
        pending: pending && JSON.parse(JSON.stringify(pending)),
        busy,
        blocked,
        needsSync,
      });
      const notify = () => changed(status());
      const fail = (code) => ({
        kind: "local",
        code,
        message: "きろくをかくにんしてね",
      });
      function valid(request) {
        if (
          !request ||
          Object.keys(request).sort().join() !==
            "datasetId,expectedVersion,op,payload,requestId" ||
          !["drawCharacter", "playRound"].includes(request.op) ||
          request.datasetId !== datasetId ||
          typeof request.requestId !== "string" ||
          !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
            request.requestId,
          ) ||
          !Number.isSafeInteger(request.expectedVersion) ||
          request.expectedVersion < 0 ||
          !request.payload ||
          typeof request.payload !== "object" ||
          Array.isArray(request.payload) ||
          new TextEncoder().encode(JSON.stringify(request)).length > 4096
        )
          throw fail("PENDING_INVALID");
      }
      try {
        storage = storage || window.sessionStorage;
        if (
          !/^[a-f0-9]{64}$/.test(datasetId) ||
          initial.data.masterVersion !== 2 ||
          storage.getItem(KEY) !== null
        )
          throw fail("PENDING_INVALID");
        const text = storage.getItem(storageKey);
        if (text !== null) {
          if (new TextEncoder().encode(text).length > 4096)
            throw fail("PENDING_INVALID");
          pending = JSON.parse(text);
          valid(pending);
        }
      } catch (_) {
        blocked = true;
      }
      function clear() {
        try {
          storage.removeItem(storageKey);
          pending = null;
        } catch (_) {
          blocked = true;
          throw fail("STORAGE_UNAVAILABLE");
        }
      }
      async function refresh() {
        const response = await rpc({ op: "bootstrap", payload: {} });
        if (
          !Number.isSafeInteger(response.version) ||
          response.version !== response.data?.state?.version ||
          response.data.datasetId !== datasetId ||
          response.data.masterVersion !== 2
        )
          throw fail("INVALID_RESPONSE");
        latest = response;
        needsSync = false;
        return response;
      }
      async function sync() {
        if (busy || pending || blocked) throw fail("PENDING_UNRESOLVED");
        busy = true;
        notify();
        try {
          return await refresh();
        } finally {
          busy = false;
          notify();
        }
      }
      async function retry(initialSend = false) {
        if (busy || blocked || !pending) throw fail("PENDING_UNRESOLVED");
        busy = true;
        notify();
        let mutation;
        try {
          try {
            mutation = await rpc(JSON.parse(JSON.stringify(pending)));
            if (
              mutation.requestId?.toLowerCase() !==
                pending.requestId.toLowerCase() ||
              mutation.version !== pending.expectedVersion + 1 ||
              mutation.data?.state?.version !== mutation.version ||
              !mutation.data?.result
            )
              throw fail("INVALID_RESPONSE");
          } catch (error) {
            // Integrity/conflict-of-ID/unknown failures keep the original request.
            const definite = [
              "INVALID_ARGUMENT",
              "VERSION_CONFLICT",
              "OP_LIMIT",
              "CHARACTER_NOT_OWNED",
              "SKILL_NOT_AVAILABLE",
              "ALL_OWNED",
            ];
            if (error.kind === "business" && definite.includes(error.code)) {
              clear();
              needsSync = true;
              try {
                error.latest = await refresh();
              } catch (_) {}
            }
            throw error;
          }
          clear();
          needsSync = true;
          if (initialSend && !mutation.replayed) {
            latest = {
              ...latest,
              version: mutation.version,
              data: {
                ...latest.data,
                state: mutation.data.state,
                limits: {
                  maxActions: 200,
                  remainingActions: 200 - mutation.version,
                },
              },
            };
            needsSync = false;
            return { mutation, latest };
          }
          return { mutation, latest: await refresh() };
        } finally {
          busy = false;
          notify();
        }
      }
      async function start(op, payload, expectedVersion) {
        if (busy || pending || blocked || needsSync)
          throw fail("PENDING_UNRESOLVED");
        const request = JSON.parse(
          JSON.stringify({
            op,
            payload,
            expectedVersion,
            datasetId,
            requestId: uuid(),
          }),
        );
        valid(request);
        try {
          storage.setItem(storageKey, JSON.stringify(request));
        } catch (_) {
          blocked = true;
          notify();
          throw fail("STORAGE_UNAVAILABLE");
        }
        pending = request;
        return retry(true);
      }
      if (initial && !blocked) needsSync = false;
      return { status, start, retry, sync };
    }
    return { create, KEY };
  })();
</script>

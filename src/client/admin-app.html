<script>
  (() => {
    const { $, el } = App.dom,
      KEY = "skill-janken-admin-generation-v1",
      characters = { C01: "ひのこ", C02: "しずく", C03: "このは" },
      outcomes = { WIN: "勝ち", LOSE: "負け", DRAW: "あいこ" },
      selections = new Map();
    let state,
      busy = false,
      pending = null,
      blocked = false,
      needsReload = false,
      selectedCharacter = "C01";
    try {
      const text = sessionStorage.getItem(KEY);
      if (text) {
        pending = JSON.parse(text);
        if (
          pending?.op !== "generate" ||
          typeof pending.payload?.requestId !== "string" ||
          typeof pending.payload?.datasetId !== "string"
        )
          throw Error();
      }
    } catch (_) {
      blocked = true;
    }
    function call(request) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler((r) =>
            r?.ok
              ? resolve(r.data)
              : reject(r?.error || { message: "応答を確認できません" }),
          )
          .withFailureHandler(() =>
            reject({
              transport: true,
              message:
                "通信結果が未確認です。一覧や同じ生成結果を確認してください。",
            }),
          )
          .adminApi(request);
      });
    }
    function controls() {
      document.querySelectorAll("button").forEach((b) => {
        b.disabled =
          busy ||
          blocked ||
          ((!state || needsReload) && b.id !== "admin-refresh") ||
          b.dataset.unavailable === "true" ||
          (b.dataset.generate === "true" &&
            state?.generation?.allowed !== true) ||
          (!!pending && b.id !== "admin-resume" && b.id !== "admin-refresh");
      });
      $("admin-resume").hidden = !pending || blocked;
      document.querySelectorAll("input[type=checkbox]").forEach((input) => {
        input.disabled = busy || blocked || needsReload || !!pending;
      });
      $("admin-panel").setAttribute("aria-busy", String(busy));
      $("admin-panel").dataset.state = busy
        ? "busy"
        : blocked || needsReload || pending
          ? "attention"
          : "ready";
    }
    function display() {
      $("admin-init").hidden = state.initialized;
      const generation = state.generation;
      const reasons = {
        ready: "候補を生成できます。",
        disabled: "AI生成は無効です。採用済みの文は使えます。",
        configuration: "生成設定が不足しています。提供者が設定してください。",
        stopped: "本日の生成は停止中です。翌日以降に一覧を読み直してください。",
        dailyLimit: "本日の生成上限に達しました。",
        reservationLimit:
          "生成記録の上限に達しました。提供者が記録を保管して対応してください。",
        unavailable: "生成状態を読み取れません。一覧を読み直してください。",
      };
      $("admin-generation").textContent = generation
        ? (reasons[generation.reason] || reasons.unavailable) +
          (Number.isInteger(generation.used)
            ? " 本日 " +
              generation.used +
              " / " +
              generation.limit +
              " 回（日本時間）。"
            : "")
        : "生成状態を確認できません。一覧を読み直してください。";
      const overview = $("admin-overview");
      overview.replaceChildren();
      overview.hidden = false;
      for (const [value, label] of [
        [state.catalog.entries.length + " / 9", "採用済みの枠"],
        [
          state.drafts.filter((d) => d.texts.length).length + " / 9",
          "下書きがある枠",
        ],
        [state.catalog.version, "公開版"],
      ]) {
        const stat = el("div", "admin-stat");
        stat.append(el("strong", "", value), el("span", "", label));
        overview.append(stat);
      }
      $("admin-empty").hidden = state.initialized;
      $("admin-filters").hidden = !state.initialized;
      $("admin-filters")
        .querySelectorAll("button")
        .forEach((b) =>
          b.setAttribute(
            "aria-pressed",
            String(b.dataset.character === selectedCharacter),
          ),
        );
      const slots = $("admin-slots");
      slots.replaceChildren();
      if (!state.initialized) return;
      for (const draft of state.drafts.filter(
        (d) =>
          selectedCharacter === "all" ||
          d.slotKey.startsWith(selectedCharacter + "_"),
      )) {
        const [c, o] = draft.slotKey.split("_"),
          box = el("section", "card");
        box.id = "slot-" + draft.slotKey;
        const title = el("h2", "", characters[c] + " ／ " + outcomes[o]);
        title.id = "slot-title-" + draft.slotKey;
        title.tabIndex = -1;
        box.setAttribute("aria-labelledby", title.id);
        const published = state.catalog.entries.find(
          (e) => e.characterId === c && e.outcome === o,
        );
        box.append(
          title,
          el(
            "span",
            "tag",
            published
              ? "採用済み " + published.texts.length + "文"
              : "定型文のみ",
          ),
        );
        const live = el("div", "slot-section");
        live.append(el("h3", "", "ゲームで使う文"));
        if (published)
          published.texts.forEach((t) => live.append(el("p", "bubble", t)));
        else
          live.append(
            el(
              "p",
              "hint",
              "用意された定型文で遊べます。AI生成をしなくても、ゲームは動きます。",
            ),
          );
        box.append(live);
        const draftArea = el("div", "slot-section");
        draftArea.append(
          el("h3", "", "候補を作る・選ぶ"),
          el(
            "p",
            "hint",
            "下書きは未公開です。内容を読んで、使う文にチェックしてください。",
          ),
        );
        const generate = el("button", "secondary", "候補を生成");
        generate.id = "generate-" + draft.slotKey;
        generate.dataset.generate = "true";
        generate.addEventListener("click", () =>
          run(async () => {
            const request = {
              op: "generate",
              payload: {
                datasetId: state.datasetId,
                requestId: crypto.randomUUID(),
                slotKey: draft.slotKey,
                draftRevision: draft.revision,
              },
            };
            try {
              sessionStorage.setItem(KEY, JSON.stringify(request));
            } catch (_) {
              blocked = true;
              throw { message: "保存領域を利用できないため生成を停止しました" };
            }
            pending = request;
            return await sendPending();
          }, draft.slotKey),
        );
        draftArea.append(generate);
        if (!draft.texts.length)
          draftArea.append(
            el(
              "p",
              "empty-state",
              "候補はまだありません。生成した文は、ここで確認できます。",
            ),
          );
        const selectionKey =
          state.datasetId + ":" + draft.slotKey + ":" + draft.revision;
        const selected = selections.get(selectionKey) || new Set();
        const checks = [],
          publish = el("button", "", "選んだ文を採用・公開");
        publish.id = "publish-" + draft.slotKey;
        publish.dataset.unavailable = "true";
        draft.texts.forEach((t, i) => {
          const label = el("label"),
            input = el("input");
          input.type = "checkbox";
          input.value = i;
          input.checked = selected.has(i);
          checks.push(input);
          input.addEventListener("change", () => {
            selections.set(
              selectionKey,
              new Set(
                checks
                  .map((x, index) => (x.checked ? index : -1))
                  .filter((index) => index >= 0),
              ),
            );
            publish.dataset.unavailable = String(
              !checks.some((x) => x.checked),
            );
            publish.textContent = checks.some((x) => x.checked)
              ? "選んだ文を採用・公開（" +
                checks.filter((x) => x.checked).length +
                "文）"
              : "選んだ文を採用・公開";
            controls();
          });
          label.append(input, el("span", "", t));
          draftArea.append(label);
        });
        publish.dataset.unavailable = String(!checks.some((x) => x.checked));
        if (checks.some((x) => x.checked))
          publish.textContent =
            "選んだ文を採用・公開（" +
            checks.filter((x) => x.checked).length +
            "文）";
        publish.addEventListener("click", () => {
          const selectedIndices = checks
            .map((x, i) => (x.checked ? i : -1))
            .filter((i) => i >= 0);
          if (!selectedIndices.length) return;
          void run(
            () =>
              call({
                op: "publish",
                payload: {
                  datasetId: state.datasetId,
                  slotKey: draft.slotKey,
                  draftRevision: draft.revision,
                  expectedVersion: state.catalog.version,
                  selectedIndices,
                },
              }),
            draft.slotKey,
          );
        });
        draftArea.append(publish);
        box.append(draftArea);
        if (published) {
          const clear = el("button", "text-button", "採用を解除して定型文へ");
          clear.id = "clear-" + draft.slotKey;
          clear.addEventListener("click", () =>
            run(
              () =>
                call({
                  op: "publish",
                  payload: {
                    datasetId: state.datasetId,
                    slotKey: draft.slotKey,
                    draftRevision: draft.revision,
                    expectedVersion: state.catalog.version,
                    selectedIndices: [],
                  },
                }),
              draft.slotKey,
            ),
          );
          box.append(clear);
        }
        slots.append(box);
      }
      controls();
    }
    async function sendPending() {
      if (!pending || pending.payload.datasetId !== state.datasetId)
        throw {
          message:
            "保存先が変わっています。旧要求を送信せず、管理者が確認してください。",
        };
      try {
        const next = await call(pending);
        sessionStorage.removeItem(KEY);
        pending = null;
        return next;
      } catch (e) {
        if (
          !e.transport &&
          [
            "INVALID_ARGUMENT",
            "VERSION_CONFLICT",
            "AI_DISABLED",
            "AI_LIMIT",
            "AI_UNAVAILABLE",
            "DATASET_MISMATCH",
            "LEGACY_DATA_READ_ONLY",
          ].includes(e.code)
        ) {
          try {
            sessionStorage.removeItem(KEY);
            pending = null;
          } catch (_) {
            blocked = true;
          }
        }
        throw e;
      }
    }
    async function run(work, slotKey) {
      if (busy || blocked) return;
      const originId = document.activeElement?.id;
      let completed = false;
      busy = true;
      controls();
      $("admin-status").textContent =
        "処理中です。生成には時間がかかることがあります。";
      try {
        state = await work();
        needsReload = false;
        display();
        completed = true;
        $("admin-status").textContent =
          state.status === "generated"
            ? "候補を保存しました。内容を確認して採用してください。"
            : state.status === "failed"
              ? "生成を採用できませんでした。公開済みの文は保持しています。"
              : state.status === "unknown"
                ? "この要求は結果未確定です。自動で再生成しません。下書きを確認してください。"
                : "読み込み・保存を確認しました。公開した文はゲームの起動・きろくの読込後から使われます。";
      } catch (e) {
        needsReload = true;
        $("admin-status").textContent =
          e.message || "確認できませんでした。一覧を読み直してください。";
      } finally {
        busy = false;
        controls();
        if (completed && slotKey) $("slot-title-" + slotKey)?.focus();
        else if (completed && originId === "admin-init")
          $("admin-filters").querySelector("button")?.focus();
        else if (originId) $(originId)?.focus();
      }
    }
    $("admin-filters")
      .querySelectorAll("button")
      .forEach((b) =>
        b.addEventListener("click", () => {
          selectedCharacter = b.dataset.character;
          display();
          b.focus();
        }),
      );
    $("admin-refresh").addEventListener("click", () =>
      run(() => call({ op: "list", payload: {} })),
    );
    $("admin-init").addEventListener("click", () =>
      run(() =>
        call({ op: "initialize", payload: { datasetId: state.datasetId } }),
      ),
    );
    $("admin-resume").addEventListener("click", () => {
      const slotKey = pending?.payload?.slotKey;
      if (slotKey && characters[slotKey.split("_")[0]])
        selectedCharacter = slotKey.split("_")[0];
      run(sendPending, slotKey);
    });
    if (blocked) {
      $("admin-status").textContent =
        "保存領域を確認できません。管理操作を停止しました。";
      controls();
    } else run(() => call({ op: "list", payload: {} }));
  })();
</script>
